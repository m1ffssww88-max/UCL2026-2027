<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--bg2:#101731;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.08);--border:rgba(255,255,255,.11);--txt:#eef1f8;--mut:#8b93ad;--mut2:#5a6280;--g1:#7c5cff;--g2:#00d4ff;--gold:#ffd166;--green:#2ee6a8;--red:#ff5c7a;--orange:#ffb454}
body{font-family:'Cairo',Tahoma,sans-serif;background:radial-gradient(1200px 600px at 85% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(900px 500px at -10% 30%,rgba(0,212,255,.14),transparent 55%),linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg));color:var(--txt);min-height:100vh}
#app{max-width:860px;margin:0 auto;padding:16px 14px 60px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:8px}
button,input,select{font-family:inherit}
.mut{color:var(--mut);font-size:12.5px}.mut2{color:var(--mut2);font-size:11.5px}
.mono{font-family:'Courier New',monospace;letter-spacing:1.5px;font-weight:700}
.glass{background:var(--card);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(8px)}
.btn{border:none;cursor:pointer;border-radius:12px;padding:10px 20px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 4px 18px rgba(124,92,255,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(0,212,255,.4)}
.btn:active{transform:scale(.97)}
.btn.sm{padding:6px 14px;font-size:12.5px;border-radius:10px}
.btn.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--border);color:var(--txt)}
.btn.danger{background:linear-gradient(135deg,#ff5c7a,#ff8f5c);box-shadow:0 4px 14px rgba(255,92,122,.3)}
.btn.green{background:linear-gradient(135deg,#0fce8a,#2ee6a8);color:#04241a;box-shadow:0 4px 14px rgba(46,230,168,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.inp{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--txt);font-size:14px;outline:none;transition:border .2s}
.inp:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(0,212,255,.15)}
select.inp{cursor:pointer}select.inp option{background:#131a33;color:#fff}
.row{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:6px;margin:14px 0;overflow-x:auto;padding-bottom:2px}
.tab{white-space:nowrap;background:var(--card);border:1px solid var(--border);color:var(--mut);border-radius:12px;padding:9px 18px;cursor:pointer;font-weight:700;font-size:13.5px;transition:all .2s}
.tab.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(124,92,255,.4)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;transition:border .2s}
.card:hover{border-color:rgba(255,255,255,.2)}
.badge{display:inline-block;border-radius:8px;padding:2px 10px;font-size:11.5px;font-weight:800}
.b3{background:rgba(46,230,168,.16);color:var(--green)}.b1{background:rgba(255,180,84,.16);color:var(--orange)}.b0{background:rgba(255,92,122,.14);color:var(--red)}
.pts{font-variant-numeric:tabular-nums;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--mut2);font-weight:600;text-align:right;padding:8px;border-bottom:1px solid var(--border);font-size:11.5px;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
tr:last-child td{border-bottom:none}
.hero{text-align:center;padding:34px 0 10px}
.hero .ball{width:74px;height:74px;margin:0 auto 14px;border-radius:50%;background:conic-gradient(from 20deg,#fff 0 60deg,#1a1f36 60deg 120deg,#fff 120deg 180deg,#1a1f36 180deg 240deg,#fff 240deg 300deg,#1a1f36 300deg);box-shadow:0 0 44px rgba(0,212,255,.35),inset 0 0 0 5px rgba(255,255,255,.15);animation:bounce 2.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero h1{font-size:26px;font-weight:900;background:linear-gradient(90deg,#fff,#a9b6ff,#7ce9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin-top:6px;font-size:13.5px}
.login-box{padding:20px;margin-top:8px}
.login-box h3{font-size:15px;font-weight:800;margin-bottom:4px}
.code-inp{text-align:center;letter-spacing:3px;font-family:'Courier New',monospace;font-weight:700}
.fav3{display:flex;gap:10px;margin:10px 0}
.fav3 .fav{flex:1;border:2px solid var(--border);border-radius:14px;padding:14px 6px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(0,0,0,.2)}
.fav3 .fav.sel{border-color:var(--g2);box-shadow:0 0 20px rgba(0,212,255,.25);transform:translateY(-2px)}
.fav3 .fav div{font-size:13px;font-weight:800;margin-top:8px}
.round-chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.rchip{border:1px solid var(--border);background:var(--card);color:var(--mut);border-radius:10px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:12.5px;transition:all .15s}
.rchip.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent}
.match{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.match .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.teambox{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:86px}
.teambox .tn{font-size:12.5px;font-weight:800;text-align:center}
.score-row{display:flex;align-items:center;gap:6px}
.score-row .inp{width:54px;text-align:center;padding:8px 4px;font-weight:800;font-size:16px}
.midinfo{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px}
.squad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;transition:all .15s}
.pcard:hover{border-color:rgba(0,212,255,.4)}
.pcard .pname{font-weight:800;font-size:13.5px}
.poschip{font-size:10px;border-radius:6px;padding:1px 7px;font-weight:800}
.posFWD{background:rgba(255,92,122,.15);color:var(--red)}.posMID{background:rgba(0,212,255,.13);color:var(--g2)}.posDEF{background:rgba(46,230,168,.14);color:var(--green)}.posGK{background:rgba(255,209,102,.15);color:var(--gold)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:10px 0}
.statgrid label{font-size:11px;color:var(--mut);display:block;margin-bottom:3px}
.statgrid .inp{padding:7px 8px;font-size:13px}
.rank1 td{background:linear-gradient(90deg,rgba(255,209,102,.14),transparent)!important}
.rank2 td{background:linear-gradient(90deg,rgba(200,210,230,.1),transparent)!important}
.rank3 td{background:linear-gradient(90deg,rgba(255,150,90,.09),transparent)!important}
.del{opacity:0;background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;font-weight:700;transition:opacity .15s}
.card:hover .del,tr:hover .del{opacity:1}
.big-num{font-size:24px;font-weight:900}
.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:12px 26px;border-radius:14px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:pop .3s ease;z-index:99}
@keyframes pop{from{opacity:0;transform:translateX(50%) translateY(14px)}to{opacity:1}}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:14px 0}
h3.sec{font-size:15px;font-weight:800;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
h3.sec::before{content:'';width:4px;height:16px;border-radius:4px;background:linear-gradient(180deg,var(--g1),var(--g2))}
.lockbtn{font-size:11px;padding:3px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--mut);cursor:pointer;font-weight:700}
.lockbtn.lkd{background:rgba(255,92,122,.15);color:var(--red);border-color:rgba(255,92,122,.3)}
#load{text-align:center;padding:80px 16px;color:var(--mut);font-weight:700}
@media(max-width:560px){.teambox{min-width:64px}.hero h1{font-size:21px}}
</style>
</head>

function mpts(p,r){if(!r)return null;if(p.h===r.h&&p.a===r.a)return 3;return Math.sign(p.h-p.a)===Math.sign(r.h-r.a)?1:0}
function matchPts(m){let t=0;for(const f of FIX){const p=m.preds[f[5]];const r=S.mres[f[5]];if(p&&r){t+=mpts(p,r)}}return t}
function specialPts(m){let t=0;if(S.res.champ&&m.champ===S.res.champ)t+=20;if(S.res.leader&&m.leader===S.res.leader)t+=10;if(S.res.scorer&&norm(m.scorer)===norm(S.res.scorer))t+=10;return t}
function fpts(pid,rnd){const p=S.players[pid];const x=S.perf[pid]&&S.perf[pid][rnd];if(!p||!x||x.min==null)return null;
 let t=0;t+=x.min>=60?2:(x.min>0?1:0);
 if(x.min>0){const g=p.pos==='FWD'?4:(p.pos==='MID'?5:6);t+=g*(x.g||0)+3*(x.a||0);
  if((p.pos==='GK'||p.pos==='DEF')&&x.cs)t+=4;
  if(p.pos==='GK')t+=Math.floor((x.sv||0)/3)+(x.ps?5:0)}
 t-=(x.yc||0)+3*(x.rc||0)+2*(x.og||0)+2*(x.pm||0);return t}
function fanPts(m){let t=0;(m.squad||[]).forEach(sl=>{for(let r=1;r<=8;r++){const x=fpts(sl.pid,r);if(x!=null)t+=x}});return t}
function totalPts(m){return matchPts(m)+specialPts(m)+fanPts(m)}
function adjPrice(price,x){let d=0;if(x<=1)d=-6;else if(x===2)d=-3;else if(x<=5)d=0;else if(x<=9)d=1;else if(x<=14)d=2;else d=4;return Math.max(5,Math.min(25,price+d))}

 const list=Object.entries(S.players).filter(([id,p])=>(!fpos||p.pos===fpos)&&(!fsearch||p.name.indexOf(fsearch)>-1)&&owned.indexOf(id)<0);
 out+='<div class="squad-grid">'+list.map(([id,p])=>'<div class="pcard"><div class="row" style="justify-content:space-between"><span class="pname">'+esc(p.name)+'</span><span class="poschip pos'+p.pos+'">'+p.pos+'</span></div>'
 +'<div class="row">'+crest(p.team,26)+'<span class="mut">'+tname(p.team)+'</span></div>'
 +'<div class="row" style="justify-content:space-between"><span class="pts" style="color:var(--gold)">'+p.price.toFixed(1)+'M</span>'
 +'<button class="btn sm green" onclick="buy(&quot;'+id+'&quot;)" '+((m.squad||[]).length>=5||p.price>left?'disabled':'')+'>شراء</button></div></div>').join('')+'</div>'
 +'<div class="mut2" style="margin-top:10px">قواعد الاحتساب: لعب 60 دقيقة +2 · هدف (مهاجم 4 / وسط 5 / دفاع وحارس 6) · صناعة 3 · شباك نظيفة للدفاع والحارس 4 · كل 3 تصديات للحارس +1 · تصدي ركلة جزاء +5 · صفراء -1 · حمراء -3 · هدف عكسي -2 · ضياع ركلة جزاء -2 — نقاط لاعبيك تُضاف لرصيدك الإجمالي</div>';
 return out}
function buy(pid){const m=S.members[ses];if((m.squad||[]).length>=5){toast('التشكيلة مكتملة (5 لاعبين)');return}
 const p=S.players[pid];const left=100-spent(m);if(p.price>left){toast('الميزانية لا تكفي');return}
 m.squad.push({pid,buy:p.price});sync().then(()=>{render();toast('انضم '+p.name+' لتشكيلتك')})}
function sell(i){const m=S.members[ses];const sl=m.squad[i];if(!sl)return;m.squad.splice(i,1);sync().then(()=>{render();toast('تم البيع')})}
function viewFantasyAdmin(){
 let out='<h3 class="sec">إضافة لاعب جديد للسوق</h3><div class="card"><div class="row" style="flex-wrap:wrap">'
 +'<input id="npname" class="inp" style="flex:2;min-width:140px" placeholder="اسم اللاعب">'
 +'<select id="npteam" class="inp" style="flex:1;min-width:110px">'+TDATA.map(t=>'<option value="'+t[0]+'">'+t[1]+'</option>').join('')+'</select>'
 +'<select id="nppos" class="inp" style="flex:1;min-width:90px"><option value="FWD">مهاجم</option><option value="MID">وسط</option><option value="DEF">مدافع</option><option value="GK">حارس</option></select>'
 +'<input id="npprice" type="number" step="0.5" min="5" max="25" value="10" class="inp" style="width:90px"><button class="btn sm" onclick="addPlayer()">إضافة</button></div></div>';
 out+='<h3 class="sec">تسجيل أداء جولة (تحتسب النقاط وتُحدّث الأسعار تلقائياً)</h3><div class="card">'
 +'<div class="row" style="flex-wrap:wrap"><select id="apround" class="inp" style="width:120px">'+Array.from({length:8},(_,i)=>'<option value="'+(i+1)+'">الجولة '+(i+1)+'</option>').join('')+'</select>'
 +'<select id="appid" class="inp" style="flex:2;min-width:160px"><option value="">— اختر اللاعب —</option>'+Object.entries(S.players).map(([id,p])=>'<option value="'+id+'">'+p.name+' · '+tname(p.team)+' · '+p.price.toFixed(1)+'M</option>').join('')+'</select></div>'
 +'<div class="statgrid">'
 +[['min','دقائق اللعب','90'],['g','أهداف','0'],['a','صناعة أهداف','0'],['sv','تصديات (حارس)','0'],['yc','بطاقات صفراء','0'],['rc','بطاقات حمراء','0'],['og','أهداف عكسية','0'],['pm','ركلات جزاء ضائعة','0']]
  .map(x=>'<div><label>'+x[1]+'</label><input id="st_'+x[0]+'" type="number" min="0" class="inp" value="'+x[2]+'"></div>').join('')
 +'<div><label>شباك نظيفة (دفاع/حارس)</label><select id="st_cs" class="inp"><option value="0">لا</option><option value="1">نعم</option></select></div>'
 +'<div><label>تصدى ركلة جزاء</label><select id="st_ps" class="inp"><option value="0">لا</option><option value="1">نعم</option></select></div></div>'
 +'<button class="btn" onclick="savePerf()">اعتماد الأداء وتحديث السعر</button>'
 +'<div class="mut2" style="margin-top:8px">قاعدة تحديث السعر: أداء سيئ جداً (نقطة أو أقل) ‎-6M · سيئ (نقطتان) ‎-3M · عادي (3-5) ثابت · جيد (6-9) ‎+1M · ممتاز (10-14) ‎+2M · خرافي (15+) ‎+4M · السقف 25M والأرضية 5M</div></div>';
 out+='<h3 class="sec">قائمة اللاعبين ('+Object.keys(S.players).length+')</h3><table><tr><th>اللاعب</th><th>النادي</th><th>المركز</th><th>السعر</th><th>النقاط</th><th></th></tr>'
 +Object.entries(S.players).map(([id,p])=>{let t=0;for(let r=1;r<=8;r++){const x=fpts(id,r);if(x!=null)t+=x}
  return '<tr><td style="font-weight:700">'+esc(p.name)+'</td><td><div class="row">'+crest(p.team,24)+'<span class="mut">'+tname(p.team)+'</span></div></td>'
  +'<td><span class="poschip pos'+p.pos+'">'+p.pos+'</span></td><td class="pts" style="color:var(--gold)">'+p.price.toFixed(1)+'M</td><td class="pts" style="color:var(--green)">'+t+'</td>'
  +'<td style="text-align:left"><button class="del" style="opacity:1" onclick="delPlayer(&quot;'+id+'&quot;)">حذف</button></td></tr>'}).join('')+'</table>';
 return out}
function addPlayer(){const n=$('npname').value.trim();if(!n){toast('اكتب اسم اللاعب');return}
 const id='p'+Date.now();S.players[id]={name:n,team:$('npteam').value,pos:$('nppos').value,price:Math.max(5,Math.min(25,+$('npprice').value||10))};
 sync().then(()=>{render();toast('أُضيف اللاعب للسوق')})}
function delPlayer(id){if(confirm('حذف اللاعب من السوق؟ سيُحذف من كل التشكيلات')){
 delete S.players[id];delete S.perf[id];
 for(const c in S.members)S.members[c].squad=(S.members[c].squad||[]).filter(s=>s.pid!==id);
 sync().then(render)}}
function savePerf(){const pid=$('appid').value;const rnd=+$('apround').value;if(!pid){toast('اختر اللاعب');return}
 const x={min:+$('st_min').value||0,g:+$('st_g').value||0,a:+$('st_a').value||0,sv:+$('st_sv').value||0,yc:+$('st_yc').value||0,rc:+$('st_rc').value||0,og:+$('st_og').value||0,pm:+$('st_pm').value||0,cs:$('st_cs').value==='1',ps:$('st_ps').value==='1'};
 if(!S.perf[pid])S.perf[pid]={};S.perf[pid][rnd]=x;
 const p=S.players[pid];const pts=fpts(pid,rnd);const old=p.price;p.price=adjPrice(p.price,pts);
 sync().then(()=>{render();toast(p.name+': '+pts+' نقطة · السعر '+(p.price-old>=0?'+':'')+(p.price-old).toFixed(1)+'M')})}
/* ============ التوقعات الكبرى (إدارة) ============ */
function viewSpecialAdmin(){return '<div class="card"><div class="mut" style="margin-bottom:10px">تحدد هذه النتائج متى شئت — تُضاف النقاط تلقائياً للأعضاء</div>'
 +'<div class="statgrid"><div><label>بطل النسخة 2026/27 (20 نقطة)</label>'+teamSel('schamp',S.res.champ)+'</div>'
 +'<div><label>الأول في مرحلة الدوري (10 نقاط)</label>'+teamSel('sleader',S.res.leader)+'</div>'
 +'<div><label>هداف البطولة (10 نقاط)</label><input id="sscorer" class="inp" value="'+esc(S.res.scorer)+'" placeholder="اسم اللاعب"></div></div>'
 +'<button class="btn" onclick="saveSpecial()">اعتماد النتائج الكبرى</button></div>'}
function saveSpecial(){S.res.champ=$('schamp').value;S.res.leader=$('sleader').value;S.res.scorer=$('sscorer').value.trim();sync().then(()=>{render();toast('اعتُمدت النتائج الكبرى')})}
/* ============ الأعضاء والأكواد (إدارة) ============ */
function viewCodes(){return '<div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="mut">أكواد جاهزة — أرسل كل كود لعضو واحد</div><button class="btn" onclick="genCode()">+ إصدار كود جديد</button></div>'
 +(S.unused.length?S.unused.map((c,i)=>'<div class="card row" style="justify-content:space-between"><span class="mono" style="color:var(--gold);font-size:15px">'+esc(c)+'</span><button class="del" style="opacity:1" onclick="delCode('+i+')">حذف</button></div>').join(''):'<div class="mut">لا توجد أكواد — اضغط إصدار كود جديد</div>')
 +'<h3 class="sec">الأعضاء ('+Object.keys(S.members).length+')</h3>'
 +(Object.keys(S.members).length?'<table><tr><th>الكود</th><th>الاسم</th><th>النادي</th><th>مباريات</th><th>كبرى</th><th>فانتزي</th><th>المجموع</th><th></th></tr>'
 +Object.entries(S.members).map(([c,m])=>'<tr><td class="mono">'+esc(c)+'</td><td style="font-weight:700">'+esc(m.name)+'</td><td>'+crest(m.club,26)+'</td><td class="pts">'+matchPts(m)+'</td><td class="pts" style="color:var(--g2)">'+specialPts(m)+'</td><td class="pts" style="color:var(--green)">'+fanPts(m)+'</td><td class="pts" style="color:var(--gold);font-size:15px">'+totalPts(m)+'</td><td style="text-align:left"><button class="del" style="opacity:1" onclick="delMember(&quot;'+c+'&quot;)">حذف</button></td></tr>').join('')+'</table>'
 :'<div class="mut">لا يوجد أعضاء بعد</div>')
 +'<div class="divider"></div><div class="mut2">كود الإدارة الحالي: <span class="mono" style="color:var(--gold)">'+esc(S.ownerCode)+'</span></div>'
 +'<div class="row" style="margin-top:8px;flex-wrap:wrap"><input id="newcode" class="inp mono" style="width:170px" placeholder="كود إدارة جديد"><button class="btn ghost sm" onclick="changeCode()">تغيير كود الإدارة</button></div>'}
function genCode(){const c='UCL-'+Math.random().toString(36).slice(2,7).toUpperCase();S.unused.push(c);sync().then(()=>{render();toast('الكود الجديد: '+c)})}
function delCode(i){S.unused.splice(i,1);sync().then(render)}
function delMember(c){if(confirm('حذف العضو '+S.members[c].name+'؟')){delete S.members[c];if(ses===c)logout();else sync().then(render)}}
function changeCode(){const v=$('newcode').value.trim();if(!v)return;S.ownerCode=v;sync().then(()=>{render();toast('تغيّر كود الإدارة')})}
/* ============ الترتيب ============ */
function viewBoard(){const b=board();
 return b.length?'<table><tr><th>#</th><th>العضو</th><th>النادي</th><th>مباريات</th><th>كبرى</th><th>فانتزي</th><th>المجموع</th></tr>'
 +b.map((x,i)=>{const mc=S.members[x.c];return '<tr class="'+(i<3?'rank'+(i+1):'')+'"><td class="pts" style="font-size:16px">'+(i+1)+'</td>'
 +'<td style="font-weight:800">'+esc(x.name)+(x.c===ses?' <span class="mut2">(أنت)</span>':'')+'</td><td>'+crest(mc.club,28)+'</td>'
 +'<td class="pts">'+x.mp+'</td><td class="pts" style="color:var(--g2)">'+x.sp+'</td><td class="pts" style="color:var(--green)">'+x.fp+'</td>'
 +'<td class="pts" style="color:var(--gold);font-size:16px">'+x.tp+'</td></tr>'}).join('')+'</table>'
 +'<div class="mut2" style="margin-top:8px">المراكز الثلاثة الأولى تظهر بميداليات ذهبية وفضية وبرونزية</div>'
 :'<div class="mut" style="text-align:center;padding:30px">لا يوجد أعضاء بعد</div>'}
/* ============ الملف الشخصي ============ */
function viewProfile(){const m=S.members[ses];
 const rows=FIX.filter(f=>m.preds[f[5]]).map(f=>{const p=m.preds[f[5]];const r=S.mres[f[5]];const pt=r?mpts(p,r):null;
  return '<tr><td><div class="row">'+crest(f[1],22)+'<span class="mut">×</span>'+crest(f[2],22)+'</div><div class="mut2">ج'+f[0]+' · '+f[3]+'</div></td>'
  +'<td class="pts">'+p.h+' - '+p.a+'</td><td class="pts">'+(r?r.h+' - '+r.a:'—')+'</td>'
  +'<td>'+(pt===null?'<span class="mut2">بانتظار النتيجة</span>':pt===3?'<span class="badge b3">+3</span>':pt===1?'<span class="badge b1">+1</span>':'<span class="badge b0">0</span>')+'</td></tr>'}).join('');
 const sp=(lbl,mine,resTxt,ok,pts)=>'<div class="card row" style="justify-content:space-between;flex-wrap:wrap"><div><div class="mut2">'+lbl+'</div><div style="font-weight:800">'+mine+'</div></div>'
 +'<div>'+(resTxt===''||resTxt==null?'<span class="mut2">بانتظار النتيجة</span>':ok?'<span class="badge b3">+'+pts+' صحيح</span>':'<span class="badge b0">0 · الصحيح: '+esc(resTxt)+'</span>')+'</div></div>';
 return '<div class="glass card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">'+crest(m.club,54)
 +'<div><div style="font-size:19px;font-weight:900">'+esc(m.name)+'</div><div class="mut">'+tname(m.club)+'</div></div>'
 +'<div style="margin-inline-start:auto;text-align:center"><div class="big-num" style="color:var(--gold)">'+totalPts(m)+'</div><div class="mut2">نقطة إجمالية</div></div></div>'
 +'<h3 class="sec">توقعاتي الكبرى</h3>'
 +sp('بطل النسخة (20 نقطة)',tname(m.champ),S.res.champ?tname(S.res.champ):'',m.champ===S.res.champ&&!!S.res.champ,20)
 +sp('صاحب المركز الأول بالدوري (10 نقاط)',tname(m.leader),S.res.leader?tname(S.res.leader):'',m.leader===S.res.leader&&!!S.res.leader,10)
 +sp('هداف البطولة (10 نقاط)',esc(m.scorer),S.res.scorer,norm(m.scorer)===norm(S.res.scorer)&&!!S.res.scorer,10)
 +'<h3 class="sec">سجل توقعات المباريات</h3>'+(rows?'<table><tr><th>المباراة</th><th>توقعك</th><th>النتيجة</th><th>النقاط</th></tr>'+rows+'</table>':'<div class="mut">لم تتوقع أي مباراة بعد</div>')}
/* ============ الهيكل العام ============ */
function tabs(list,cur,fn){return '<div class="tabs">'+list.map(t=>'<button class="tab '+(cur===t[0]?'on':'')+'" onclick="'+fn+'(&quot;'+t[0]+'&quot;)">'+t[1]+'</button>').join('')+'</div>'}
let mt='pred',ot='codes';
function head(title,sub){return '<div class="row" style="justify-content:space-between;margin:4px 0 2px"><div><div style="font-size:19px;font-weight:900">'+title+'</div><div class="mut">'+sub+'</div></div><button class="btn ghost sm" onclick="logout()">خروج</button></div>'}
function viewMember(){const m=S.members[ses];
 const body=mt==='pred'?viewMatches(false):mt==='fan'?viewFantasyMember():mt==='board'?viewBoard():viewProfile();
 return head('أهلاً '+esc(m.name),'ناديك '+tname(m.club)+' · رصيدك <b style="color:var(--gold)">'+totalPts(m)+'</b> نقطة')
 +tabs([['pred','التوقعات'],['fan','الفانتزي'],['board','الترتيب'],['prof','ملفي']],mt,'mTab')+body}
function mTab(t){mt=t;render()}
function viewAdmin(){
 const locks='<div class="row" style="flex-wrap:wrap;margin-bottom:12px"><span class="mut2">قفل التوقعات:</span>'+Array.from({length:8},(_,i)=>{const r=i+1;return '<button class="lockbtn '+(S.locked[r]?'lkd':'')+'" onclick="toggleLock('+r+')">ج'+r+' '+(S.locked[r]?'مغلقة':'مفتوحة')+'</button>'}).join('')+'</div>';
 const body=ot==='codes'?viewCodes():ot==='res'?locks+viewMatches(true):ot==='special'?viewSpecialAdmin():ot==='fan'?viewFantasyAdmin():viewBoard();
 return head('لوحة الإدارة',Object.keys(S.members).length+' عضو · '+Object.keys(S.players).length+' لاعباً في السوق · كودك <span class="mono" style="color:var(--gold)">'+esc(S.ownerCode)+'</span>')
 +tabs([['codes','الأعضاء والأكواد'],['res','النتائج'],['special','التوقعات الكبرى'],['fan','الفانتزي'],['board','الترتيب']],ot,'oTab')+body}
function oTab(t){ot=t;render()}
function render(){let h;
 if(!ses)h=viewLogin();
 else if(ses==='OWNER')h=viewAdmin();
 else if(ses.indexOf('REG:')===0)h=viewReg(ses.slice(4));
 else if(S.members[ses])h=viewMember();
 else{ses=null;h=viewLogin()}
 $('app').innerHTML=h;bindFav()}
(async()=>{await loadState();render();setInterval(async()=>{if(document.hidden)return;try{const snap=await withTimeout(_db.collection('ucl26').doc('state').get(),12000);if(snap.exists)S=snap.data();if(ses&&ses!=='OWNER'&&ses.indexOf('REG:')!==0&&S.members[ses])render()}catch(e){}},25000)})();
</script>
</body>
</html>
